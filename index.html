<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quijada's Barbershop | Digital Business Card</title>
<meta name="description" content="Leonard Anthony C. Quijada, barber at Quijada's Barbershop, Dauis, Bohol. Book a chair, see the price list or save my contact.">
<meta name="theme-color" content="#12161c">
<meta property="og:type" content="profile">
<meta property="og:title" content="Quijada's Barbershop | Digital Business Card">
<meta property="og:description" content="Clean cuts, sharp fades, hot towel shaves. Tap to book or save my contact.">
<meta property="og:image" content="https://YOUR-SITE.example/preview.jpg">
<meta property="og:url" content="https://YOUR-SITE.example/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">

<script>
/* ==========================================================================
   YOUR INFORMATION: EDIT ONLY THIS BLOCK
   ========================================================================== */
const PROFILE = {
  name:   "Leonard Anthony C. Quijada",
  first:  "Leonard Anthony",
  last:   "Quijada",
  title:  "Barber & Owner",
  org:    "Quijada's Barbershop",
  est:    "Est. 2020",
  tagline:"Clean cuts, sharp fades and hot towel shaves. Walk-ins welcome.",
  location: "Dauis, Bohol, Philippines",

  phoneRaw:     "+639949782217",
  phoneDisplay: "+63 994 978 2217",
  email:   "quijadaleonardanthony1@gmail.com",
  website: "https://toniatsoi.github.io//portfolio/index.html",
  photo: "photo.png",

  // Price list: [service, price]
  menu: [
    ["Classic haircut",       "₱150"],
    ["Fade / taper",          "₱180"],
    ["Beard trim",            "₱80"],
    ["Hot towel shave",       "₱120"],
    ["Hair + beard combo",    "₱220"],
    ["Kids cut (under 12)",   "₱100"]
  ],
  hours: [
    ["Mon – Sat", "9:00 AM – 8:00 PM"],
    ["Sunday",    "10:00 AM – 5:00 PM"]
  ],

  socials: {
    facebook:  "https://www.facebook.com/leonardanthony.quijada.31",
    instagram: "", linkedin: "", github: "", tiktok: "", youtube: ""
  }
};
/* ========================================================================== */
</script>

<style>
:root{
  --bg:#0c0f13; --card:#151a21; --raise:#1d242d; --line:#2a323d;
  --ink:#f3f1ec; --muted:#a5adb8;
  --red:#d9383a; --blue:#2d5bb5; --white:#f3f1ec;
  --pole:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--white) 14px 28px,var(--blue) 28px 42px,var(--white) 42px 56px);
}
i{display:inline-flex;font-style:normal}
svg.ic{width:1em;height:1em;display:block;flex:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:dark}
body{
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.5;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  display:flex;justify-content:center;
  background:radial-gradient(800px 420px at 50% -8%,#1c2a44,transparent 62%),var(--bg);
}
.card{width:100%;max-width:440px;margin:20px 0 28px;background:var(--card);border-radius:22px;overflow:hidden;
  box-shadow:0 28px 56px -28px #000,0 0 0 1px var(--line);animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,.shop,.price,.btn{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.04em}

/* Barber pole band: the one moving element */
.pole{height:18px;background:var(--pole);background-size:80px 80px;animation:spin 3s linear infinite}
@keyframes spin{to{background-position:80px 0}}

.head{text-align:center;padding:26px 22px 0}
.shop{font-size:2.5rem;line-height:1;display:flex;align-items:center;justify-content:center;gap:12px}
.shop i{color:var(--red);font-size:1.9rem}
.est{margin-top:6px;color:var(--muted);font-size:.85rem;font-weight:600;letter-spacing:.2em}

.profile{text-align:center;padding:22px 22px 6px}
/* avatar ringed like a barber pole */
.ring{width:128px;height:128px;border-radius:50%;margin:0 auto 14px;padding:6px;background:var(--pole);background-size:40px 40px;box-shadow:0 12px 24px -12px #000}
.avatar{width:100%;height:100%;border-radius:50%;border:4px solid var(--card);background:var(--raise);color:var(--ink);display:grid;place-items:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:2.8rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:2.1rem;line-height:1.05}
.title{margin-top:8px;display:inline-block;background:var(--red);color:#fff;padding:3px 14px;border-radius:4px;font-weight:700;letter-spacing:.06em;font-size:.88rem;text-transform:uppercase}
.bio{margin-top:14px;color:var(--muted);font-size:1.02rem}

.section{padding:14px 22px}
.section h2{font-size:1.7rem;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.section h2::after{content:"";flex:1;height:6px;background:var(--pole);background-size:40px 40px;opacity:.9;border-radius:3px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:10px;border-radius:12px;font-size:1.5rem;border:0;cursor:pointer;text-decoration:none;transition:transform .15s ease,filter .15s}
.btn i{font-size:1.4rem}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 14px 26px -16px var(--red)}
.btn.secondary{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px}
.walk{margin-top:12px;text-align:center;color:var(--muted);font-size:.92rem;font-weight:500}

/* Price list with dotted leaders */
.menu{list-style:none;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.menu li{display:flex;align-items:baseline;gap:10px;padding:11px 0;font-weight:600;font-size:1.02rem}
.menu li+li{border-top:1px solid var(--line)}
.menu .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.price{font-size:1.5rem;color:var(--ink);letter-spacing:.03em}

.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 8px 10px 12px;border-radius:14px;background:var(--raise);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease}
a.row:hover{transform:translateY(-2px);border-color:var(--red)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.15rem}
.txt{flex:1;min-width:0}
.txt small{display:block;color:var(--muted);font-size:.8rem}
.txt span{display:block;font-weight:600;overflow-wrap:anywhere}
.inner{display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none}
.copy{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
.copy:hover{background:var(--line);color:var(--ink)}
.copy.done{color:#4cd08a}

.hours{border:1px solid var(--line);border-radius:14px;background:var(--raise);padding:4px 16px}
.hours div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.hours div:last-child{border-bottom:0}
.hours dt{font-weight:700}
.hours dd{color:var(--muted)}

.socials{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.socials a{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;color:var(--ink);background:var(--raise);border:1px solid var(--line);text-decoration:none;transition:transform .15s ease,background .15s,border-color .15s}
.socials a:hover{transform:translateY(-3px);background:var(--red);border-color:var(--red);color:#fff}
.socials a:active{transform:scale(.94)}

footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 22px 22px}
a:focus-visible,button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--white);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.shop{font-size:2rem}h1{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="card">
  <div class="pole" aria-hidden="true"></div>

  <header class="head">
    <div class="shop"><i data-i="scissors"></i><span id="shop"></span></div>
    <p class="est" id="est"></p>
  </header>

  <section class="profile">
    <div class="ring"><div class="avatar" id="avatar" role="img" aria-label="Profile picture"></div></div>
    <h1 id="name"></h1>
    <p class="title" id="title"></p>
    <p class="bio" id="bio"></p>
  </section>

  <section class="section">
    <a class="btn primary" id="bookBtn"><i data-i="scissors"></i> Book a chair</a>
    <button class="btn secondary" id="saveBtn"><i data-i="contact"></i> Add to Contacts</button>
    <p class="walk">Walk-ins welcome while chairs are free.</p>
  </section>

  <section class="section" aria-labelledby="menu-h">
    <h2 id="menu-h">Price list</h2>
    <ul class="menu" id="menu"></ul>
  </section>

  <section class="section" aria-labelledby="contact-h">
    <h2 id="contact-h">Find us</h2>
    <div class="list">
      <div class="row">
        <a id="phoneLink" class="inner"><span class="ico"><i data-i="phone"></i></span><span class="txt"><small>Call or text</small><span id="phoneText"></span></span></a>
        <button class="copy" id="copyPhone" aria-label="Copy phone number"><i data-i="copy"></i></button>
      </div>
      <div class="row">
        <a id="emailLink" class="inner"><span class="ico"><i data-i="mail"></i></span><span class="txt"><small>Email</small><span id="emailText"></span></span></a>
        <button class="copy" id="copyEmail" aria-label="Copy email address"><i data-i="copy"></i></button>
      </div>
      <a class="row" id="mapLink" target="_blank" rel="noopener noreferrer"><span class="ico"><i data-i="pin"></i></span><span class="txt"><small>Shop location</small><span id="locText"></span></span></a>
      <a class="row" id="webLink" target="_blank" rel="noopener noreferrer"><span class="ico"><i data-i="globe"></i></span><span class="txt"><small>Website</small><span id="webText"></span></span></a>
    </div>
  </section>

  <section class="section" aria-labelledby="hours-h">
    <h2 id="hours-h">Shop hours</h2>
    <dl class="hours" id="hours"></dl>
  </section>

  <section class="section" id="social" aria-labelledby="social-h">
    <h2 id="social-h">Follow the shop</h2>
    <div class="socials" id="socials"></div>
  </section>

  <footer id="foot"></footer>
  <div class="pole" aria-hidden="true"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const P = PROFILE, $ = id => document.getElementById(id);

  const IC = {
    phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    contact:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    scissors:'<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>',
    facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/>',
    linkedin:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    github:'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
    youtube:'<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><path d="m9.75 15.02 5.75-3.27-5.75-3.27z"/>',
    tiktok:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'
  };
  const ic = n => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
  document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = ic(e.dataset.i));

  $("shop").textContent = P.org;
  $("est").textContent = P.est || "";
  $("name").textContent = P.name;
  $("title").textContent = P.title;
  $("bio").textContent = P.tagline;
  $("phoneText").textContent = P.phoneDisplay;
  $("emailText").textContent = P.email;
  $("locText").textContent = P.location;
  $("webText").textContent = P.website.replace(/^https?:\/\//,"");
  $("foot").textContent = "© " + new Date().getFullYear() + " " + P.org;

  function initials(){ return (P.first[0] + P.last[0]).toUpperCase(); }
  const av = $("avatar");
  if (P.photo) {
    const img = new Image(); img.src = P.photo; img.alt = P.name + " profile picture";
    img.onerror = () => { img.remove(); av.textContent = initials(); };
    av.appendChild(img);
  } else av.textContent = initials();

  $("phoneLink").href = "tel:" + P.phoneRaw;
  $("bookBtn").href = "tel:" + P.phoneRaw;
  $("emailLink").href = "mailto:" + P.email;
  $("mapLink").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(P.location);
  $("webLink").href = P.website;

  P.menu.forEach(m => {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.textContent = m[0];
    const d = document.createElement("span"); d.className = "dots"; d.setAttribute("aria-hidden","true");
    const p = document.createElement("span"); p.className = "price"; p.textContent = m[1];
    li.append(n, d, p); $("menu").appendChild(li);
  });
  P.hours.forEach(h => {
    const d = document.createElement("div");
    const dt = document.createElement("dt"); dt.textContent = h[0];
    const dd = document.createElement("dd"); dd.textContent = h[1];
    d.append(dt, dd); $("hours").appendChild(d);
  });

  const icons = {
    facebook:["facebook","Facebook"], instagram:["instagram","Instagram"],
    linkedin:["linkedin","LinkedIn"], github:["github","GitHub"],
    tiktok:["tiktok","TikTok"], youtube:["youtube","YouTube"]
  };
  const alwaysShow = ["facebook","instagram","tiktok"];
  Object.keys(icons).forEach(k => {
    const url = P.socials[k];
    if (!url && !alwaysShow.includes(k)) return;
    const a = document.createElement("a");
    a.setAttribute("aria-label", icons[k][1] + " profile");
    if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
    else { a.href = "#"; a.addEventListener("click", e => { e.preventDefault(); toast(icons[k][1] + " link not added yet"); }); }
    a.innerHTML = ic(icons[k][0]);
    $("socials").appendChild(a);
  });

  let t; function toast(msg){
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  async function copy(text, btn, label){
    try { await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    btn.classList.add("done"); btn.innerHTML = ic("check");
    toast(label + " copied");
    setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = ic("copy"); }, 1800);
  }
  $("copyPhone").onclick = e => copy(P.phoneRaw, e.currentTarget, "Phone number");
  $("copyEmail").onclick = e => copy(P.email, e.currentTarget, "Email");

  function buildVCard(){
    const esc = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
    return [
      "BEGIN:VCARD","VERSION:3.0",
      "N:" + esc(P.last) + ";" + esc(P.first) + ";;;",
      "FN:" + esc(P.name),
      "ORG:" + esc(P.org),
      "TITLE:" + esc(P.title),
      "TEL;TYPE=CELL:" + P.phoneRaw,
      "EMAIL;TYPE=INTERNET:" + P.email,
      "URL:" + P.website,
      "ADR;TYPE=WORK:;;" + esc(P.location) + ";;;;",
      "END:VCARD"
    ].join("\r\n");
  }
  $("saveBtn").onclick = () => {
    const blob = new Blob([buildVCard()], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = P.last + "_" + P.first.replace(/\s+/g,"_") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Contact file ready. Open it to save.");
  };
})();
</script>
</body>
</html>
